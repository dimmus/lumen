# xdg-desktop-portal's backends for a Lumen session (XDG_CURRENT_DESKTOP=Lumen), see
# portals.conf(5). Each interface from the backend that does it best here:
#   Screenshot  lumen  xdg-desktop-portal-lumen: interactive area/screen/window choice,
#                      PickColor, private files (xdpw's runs grim into a fixed /tmp path)
#   ScreenCast  wlr    xdg-desktop-portal-wlr: PipeWire over ext-image-copy-capture (outputs
#                      and windows, dma-buf, damage); its source chooser is
#                      `xdg-desktop-portal-lumen --choose` (xdg-desktop-portal-wlr/Lumen)
#   Inhibit     none   gtk's needs GNOME's session manager; apps fall back to Wayland's
#                      idle-inhibit, which Lumen implements
#   everything else    gtk (file chooser, access dialogs, settings, app chooser, …)
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=lumen
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Inhibit=none
