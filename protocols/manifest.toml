privileged = true

# zwp_input_method_v2 + zwp_virtual_keyboard_v1 (wlroots protocol/): what fcitx5 and ibus
# speak to wlroots-family compositors. wayland-protocols' experimental xx-input-method is
# not generated: no shipping input method speaks it (protocols/README.md).
[[wlroots.protocol]]
name = "input-method-unstable-v2"
path = "input-method-unstable-v2.xml"
module = "lx.wayland.protocols.input_method"

[[wlroots.protocol]]
name = "virtual-keyboard-unstable-v1"
path = "virtual-keyboard-unstable-v1.xml"
module = "lx.wayland.protocols.virtual_keyboard"
