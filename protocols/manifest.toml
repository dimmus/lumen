# Lumen Wayland protocol registry
# Source of truth for fetch-protocols.sh, protocol_manifest.py, and CMake codegen.

[upstream]
wayland_repo = "https://gitlab.freedesktop.org/wayland/wayland.git"
wayland_protocols_repo = "https://gitlab.freedesktop.org/wayland/wayland-protocols.git"
wayland_protocols_tag = "1.49"

[wlr]
repo = "https://gitlab.freedesktop.org/wlroots/wlr-protocols.git"

# wlroots' own protocol/ directory: the input-method-v2 and virtual-keyboard-v1 that
# shipping input methods (fcitx5, ibus) speak. Fetched to protocols/upstream/wlroots/.
[wlroots]
repo = "https://gitlab.freedesktop.org/wlroots/wlroots.git"
tag = "0.20.2"

[[upstream.protocol]]
name = "wayland"
path = "wayland.xml"
source = "wayland"
module = "lx.wayland.protocols.core"

[[upstream.protocol]]
name = "xdg-shell"
path = "stable/xdg-shell/xdg-shell.xml"
source = "wayland-protocols"
module = "lx.wayland.protocols.xdg"

